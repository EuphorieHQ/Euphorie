# Revalidate homepage HTML. Existing API and asset routes remain in the vhost.
# Negative expiry emits Cache-Control: no-cache without replacing inherited headers.
location = / {
    root /home/ubuntu/Euphorie/frontend;
    try_files /index.html =404;
    expires -1;
}

location = /index.html {
    root /home/ubuntu/Euphorie/frontend;
    expires -1;
}

# Revalidate current and task-specific policy documents, including extensionless links.
location ~ ^/(privacy|terms|task-privacy|task-terms)(\.html)?$ {
    root /home/ubuntu/Euphorie/frontend;
    try_files $uri $uri.html =404;
    expires -1;
}
